{% extends 'pages/base.html' %}

{% block head %}
    <link rel="stylesheet" href="{{url_for('static',filename='css/pages/user_profile.css')}}" />
    <title>User_profile</title>
{% endblock %}

{% block body %} 


<section class="setting-page" id="setting-page">
    <!-- PAGE MENU BAR-->
    <div class="user_profile_content">
        <div class="user_profile_info">
            <h1>Settings</h1>
            <div class="user_profile_navigation_">
                <div class="user_profile_navigation">
                    <p class="user_profile_menu active">My account</p>
                    <p class="user_profile_menu">Company</p>
                </div>
                <div class="blue_helping_nav_bar"></div>
            </div>
        </div>
    </div>

    <!-- MY ACCAUNT PAGE -->
    <div class="user_profile_main my_accaunt">
        <div class="user_profile_main_left">
            <div class="user_profile_img_box">
                <img src="{{ data['user'].image }}" alt="User Profile Picture">
            </div>  
        </div>
        <div class="user_profile_main_right">
            <div class="accaunt_info">
                <h1>Accaunt Info</h1>

                <form class="user_profile_inputs" action="/">
                    <div class="form-group longer-width">
                        <label>Full Name</label>
                        <input type="text" placeholder="Enter your full name" value="{{ data['user'].name }}">
                    </div>
                    <div class="form-group">
                        <label>Job Title</label>
                        <input type="text" placeholder="Enter your Job Title" value="{{ data['user'].organization }}">
                    </div>
                    <div class="form-group  longer-width">
                        <label>Email Address</label>
                        <input type="email" placeholder="Enter your email" value="{{ data['user'].email }}">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="Enter your Phone Number" value="{{ data['user'].phone }}">
                    </div>
                    <div class="form-group full-width">
                        <label>Main Personal Number</label>
                        <input type="tel" placeholder="Enter your Main Personal Number" value="{{ data['user'].personal_number }}">
                    </div>
                </form>                
            </div>
            <div class="password_info">
                <h1>Password Info</h1>

                <form class="user_password_inputs" action="/">
                    <div class="form-group full-width">
                        <label>CurentPasssword</label>
                        <input class="old_password" type="password" placeholder="Write your password">
                        <p class="error"></p>
                    </div>
                    <div class="form-group full-width">
                        <label>New Password</label>
                        <input class="new_password" type="password" placeholder="Write New Password">
                        <p class="error"></p>
                    </div>
                    <div class="form-group full-width">
                        <label>Confirm New Password</label>
                        <input class="confirm_new_pswrd" type="password" placeholder="Confirm New Paswword">
                        <p class="error"></p>
                    </div>
                    <button type="submit">Apply changes</button>
                </form>
            </div>
        </div>
    </div>
    <!-- MY ACCAUNT PAGE END -->
</section>
    
    <script src="{{ url_for('static', filename='js/pages/user_profile.js') }}"></script>
{% endblock %}
